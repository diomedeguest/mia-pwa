<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Menu - Diomede Luxury</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Open+Sans:wght@400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,200,0,0&display=swap" rel="stylesheet">
    
    <style>
        :root { --glass: rgba(255, 255, 255, 0.2); --glass-border: rgba(255, 255, 255, 0.3); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body, html { height: 100%; font-family: 'Open Sans', sans-serif; color: white; overflow: hidden; }

        .bg-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('../assets/images/sfondo.png') center/cover;
        }

        /* Animazioni */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes logoFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .container { 
            padding: 10px 15px 20px; display: flex; flex-direction: column; 
            align-items: center; height: 100vh; justify-content: space-between; 
        }

        /* Header */
        .header-section { text-align: center; width: 100%; margin-top: 5px; display: flex; flex-direction: column; align-items: center; }
        .logo-img { 
            width: 95%; max-width: 450px; height: auto; margin-bottom: 5px; opacity: 0; 
            animation: logoFadeIn 1s ease-out forwards 0.2s; 
        }
        .welcome-text { 
            font-family: 'PT Serif', serif; font-size: 32px; text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5); opacity: 0; animation: fadeInUp 0.8s forwards 0.5s; 
        }
        .subtitle { 
            font-family: 'PT Serif', serif; font-size: 16px; margin: 5px 0 10px; max-width: 300px;
            opacity: 0; animation: fadeInUp 0.8s forwards 0.7s; 
        }

        /* Lingua */
        .lang-switcher { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; z-index: 10; }
        .lang-btn { 
            width: 35px; height: 35px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.1); color: white; font-size: 10px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(5px);
        }
        .lang-btn.active { background: white; color: black; }

        /* Griglia */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 10px; width: 100%; max-width: 390px; }
        .btn { text-decoration: none; display: flex; flex-direction: column; align-items: center; color: white; opacity: 0; animation: fadeInUp 0.5s forwards; }
        .btn:nth-child(n) { animation-delay: calc(0.7s + (0.05s * var(--i))); }
        .circle { 
            width: 72px; height: 72px; background: var(--glass); backdrop-filter: blur(10px);
            border-radius: 50%; display: flex; justify-content: center; align-items: center; 
            margin-bottom: 5px; border: 1px solid var(--glass-border); transition: transform 0.2s;
        }
        .btn:active .circle { transform: scale(0.9); }
        .material-symbols-outlined { font-size: 28px; }
        .label { font-size: 8px; text-transform: uppercase; font-weight: 700; text-align: center; }

        /* Meteo */
        .weather-widget {
            display: flex; align-items: center; gap: 10px; padding: 5px 18px; margin-bottom: 10px;
            background: rgba(255,255,255,0.12); backdrop-filter: blur(15px); border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.15); text-decoration: none; color: white;
            opacity: 0; animation: fadeInUp 0.8s forwards 1.5s; transition: transform 0.2s;
        }
        .weather-widget:active { transform: scale(0.95); }
        #weather-icon { font-size: 38px; }
        .temp-val { font-size: 19px; font-weight: 600; font-family: 'PT Serif', serif; }
        .city-name { font-family: 'PT Serif', serif; font-size: 14px; font-weight: 700; border-left: 1px solid rgba(255,255,255,0.3); padding-left: 10px; }
    </style>
</head>
<body>

    <div class="bg-container"></div>

    <div class="lang-switcher">
        <div id="btn-it" class="lang-btn active" onclick="setLanguage('it')">ITA</div>
        <div id="btn-en" class="lang-btn" onclick="setLanguage('en')">ENG</div>
    </div>

    <div class="container">
        <header class="header-section">
            <img src="../assets/images/header.png" alt="Logo" class="logo-img">
            <h1 class="welcome-text" data-it="Benvenuti" data-en="Welcome">Benvenuti</h1>
            <p class="subtitle" data-it="Mettetevi comodi e godetevi il soggiorno." data-en="Make yourself comfortable and enjoy your stay.">Mettetevi comodi e godetevi il soggiorno.</p>
        </header>

        <nav class="grid">
            <a href="dettagli.html" class="btn" style="--i:1"><div class="circle"><span class="material-symbols-outlined">home</span></div><span class="label" data-it="Dotazioni" data-en="Amenities">Dotazioni</span></a>
            <a href="contatti.html" class="btn" style="--i:2"><div class="circle"><span class="material-symbols-outlined">call</span></div><span class="label" data-it="Contatti" data-en="Contacts">Contatti</span></a>
            <a href="regole.html" class="btn" style="--i:3"><div class="circle"><span class="material-symbols-outlined">gavel</span></div><span class="label" data-it="Regole" data-en="House Rules">Regole</span></a>
            <a href="istruzioni.html" class="btn" style="--i:4"><div class="circle"><span class="material-symbols-outlined">menu_book</span></div><span class="label" data-it="Istruzioni" data-en="Instructions">Istruzioni</span></a>
            <a href="wifi.html" class="btn" style="--i:5"><div class="circle"><span class="material-symbols-outlined">wifi</span></div><span class="label" data-it="Wi-Fi" data-en="Wi-Fi">Wi-Fi</span></a>
            <a href="trasporti.html" class="btn" style="--i:6"><div class="circle"><span class="material-symbols-outlined">directions_bus</span></div><span class="label" data-it="Trasporti" data-en="Transport">Trasporti</span></a>
            <a href="turismo.html" class="btn" style="--i:7"><div class="circle"><span class="material-symbols-outlined">explore</span></div><span class="label" data-it="Territorio" data-en="Explore">Territorio</span></a>
            <a href="convenzioni.html" class="btn" style="--i:8"><div class="circle"><span class="material-symbols-outlined">sell</span></div><span class="label" data-it="Partner" data-en="Partners">Partner</span></a>
            <a href="checkout.html" class="btn" style="--i:9"><div class="circle"><span class="material-symbols-outlined">logout</span></div><span class="label" data-it="Check-Out" data-en="Check-Out">Check-Out</span></a>
        </nav>

        <a href="https://www.google.com/search?q=meteo+brindisi" target="_blank" class="weather-widget">
            <span id="weather-icon" class="material-symbols-outlined">cloud</span>
            <span id="description" class="weather-desc">...</span>
            <span id="temp" class="temp-val">--</span>
            <span class="city-name">Brindisi</span>
        </a>
    </div>

    <script>
        const weatherMap = { 
            0: { icon: 'wb_sunny', it: 'Sereno', en: 'Clear sky' }, 
            1: { icon: 'partly_cloudy_day', it: 'Quasi sereno', en: 'Mainly clear' }, 
            2: { icon: 'partly_cloudy_day', it: 'Parz. nuvoloso', en: 'Partly cloudy' }, 
            3: { icon: 'cloud', it: 'Nuvoloso', en: 'Overcast' }, 
            45: { icon: 'foggy', it: 'Nebbia', en: 'Fog' }, 
            61: { icon: 'rainy', it: 'Pioggia', en: 'Rain' }, 
            95: { icon: 'thunderstorm', it: 'Temporale', en: 'Thunderstorm' } 
        };

        function setLanguage(lang) {
            document.getElementById('btn-it').classList.toggle('active', lang === 'it');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.querySelectorAll('[data-it]').forEach(el => el.innerText = el.getAttribute('data-' + lang));
            localStorage.setItem('preferredLang', lang);
            updateWeather(lang);
        }

        async function updateWeather(lang = 'it') {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=40.6321&longitude=17.9361&current_weather=true&timezone=auto`);
                const data = await res.json();
                if (data.current_weather) {
                    const info = weatherMap[data.current_weather.weathercode] || { icon: 'cloud', it: 'Nuvoloso', en: 'Cloudy' };
                    document.getElementById('temp').innerText = Math.round(data.current_weather.temperature) + '°C';
                    document.getElementById('weather-icon').innerText = info.icon;
                    document.getElementById('description').innerText = info[lang];
                }
            } catch (e) { document.getElementById('description').innerText = "---"; }
        }

        window.onload = () => {
            const savedLang = localStorage.getItem('preferredLang') || 'it';
            setLanguage(savedLang);
            setInterval(() => updateWeather(localStorage.getItem('preferredLang')), 1200000);
        };
    </script>
</body>
</html>
