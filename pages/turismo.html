<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Turismo - Diomede Luxury</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Open+Sans:wght@400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,200,0,0&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Open Sans', sans-serif; 
            margin: 0; padding: 0; 
            background-color: #F0EDE9; 
            color: #1a1a1a;
            line-height: 1.4;
            text-align: center;
        }

        /* LINGUA SWITCHER */
        .lang-switcher {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        .lang-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.6);
            color: #1a1a1a;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }

        .lang-btn.active {
            background: #A39689;
            color: white;
            border-color: #A39689;
        }

        /* HEADER */
        .hero-header {
            width: 100%;
            height: 240px; 
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px 20px;
            overflow: hidden;
        }

        .logo-img {
            width: 100%;
            max-width: 300px; 
            height: auto;
            z-index: 5;
            display: block;
        }

        .hero-overlay {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 60px;
            background: linear-gradient(to top, #F0EDE9, rgba(240, 237, 233, 0));
        }

        /* CONTAINER */
        .container { 
            width: 100%; 
            max-width: 900px; 
            margin: -30px auto 0; 
            padding: 0 20px 80px;
            position: relative;
            z-index: 10;
        }

        h2 { 
            font-family: 'PT Serif', serif; 
            font-size: 34px; 
            margin: 0; 
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #2c2c2c;
        }
        
        .divider { width: 50px; height: 1px; background-color: #A39689; margin: 10px auto 30px; }

        /* Griglia delle destinazioni */
        .destinations-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            text-align: left;
            margin-top: 10px;
        }

        @media (min-width: 768px) {
            .hero-header { height: 280px; }
            .logo-img { max-width: 400px; }
            .container { margin-top: -40px; }
            .destinations-grid { grid-template-columns: 1fr 1fr; gap: 15px; }
            h2 { font-size: 40px; }
        }

        /* CARD COORDINATE */
        .destination-card {
            background-color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(163, 150, 137, 0.3);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }

        .dest-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .dest-header h3 {
            margin: 0;
            font-family: 'PT Serif', serif;
            font-size: 20px;
            font-weight: 400;
            color: #1a1a1a;
        }

        .distance-tag {
            font-size: 9px;
            text-transform: uppercase;
            background: #A39689;
            padding: 4px 10px;
            border-radius: 50px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .dest-description {
            margin: 0 0 15px 0;
            font-size: 13px;
            color: #333;
            line-height: 1.5;
            flex-grow: 1;
        }

        .maps-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            border: 1px solid #A39689;
            border-radius: 10px;
            padding: 8px 15px;
            text-decoration: none;
            color: #1a1a1a;
            width: fit-content;
            transition: all 0.2s ease;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .maps-btn:active { background-color: #A39689; color: #fff; }

        /* BACK BUTTON */
        .back-btn-container { text-align: center; margin-top: 50px; }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #A39689;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .back-btn:active { transform: scale(0.96); background-color: #8D8378; }

        .back-btn .material-symbols-outlined {
            margin-right: 10px;
            font-size: 16px;
            font-variation-settings: 'wght' 500;
        }
    </style>
</head>
<body>

    <div class="lang-switcher">
        <div id="btn-it" class="lang-btn" onclick="setLanguage('it')">ITA</div>
        <div id="btn-en" class="lang-btn" onclick="setLanguage('en')">ENG</div>
    </div>

    <div class="hero-header">
        <img src="../assets/images/header.png" alt="Diomede Luxury Logo" class="logo-img">
        <div class="hero-overlay"></div>
    </div>

    <div class="container">
        <h2 data-it="Esplora il Territorio" data-en="Explore the Area">Esplora il Territorio</h2>
        <div class="divider"></div>

        <div class="destinations-grid">
            
            <div class="destination-card">
                <div class="dest-header">
                    <h3>Brindisi</h3>
                    <span class="distance-tag">0 min</span>
                </div>
                <p class="dest-description" 
                   data-it="Il porto naturale, la scalinata monumentale e le Colonne Romane." 
                   data-en="The natural harbor, the monumental staircase, and the Roman Columns."></p>
                <a href="https://maps.google.com" target="_blank" class="maps-btn">
                    <span class="material-symbols-outlined" style="margin-right: 6px; font-size: 16px;">location_on</span>
                    <span data-it="Posizione" data-en="Location">Posizione</span>
                </a>
            </div>
            
            <div class="destination-card">
                <div class="dest-header">
                    <h3>Mesagne</h3>
                    <span class="distance-tag">15 min</span>
                </div>
                <p class="dest-description" 
                   data-it="Il centro storico a forma di cuore e l'imponente Castello Svevo." 
                   data-en="The heart-shaped historic center and the imposing Swabian Castle."></p>
                <a href="https://maps.google.com" target="_blank" class="maps-btn">
                    <span class="material-symbols-outlined" style="margin-right: 6px; font-size: 16px;">location_on</span>
                    <span data-it="Posizione" data-en="Location">Posizione</span>
                </a>
            </div>

            <div class="destination-card">
                <div class="dest-header">
                    <h3>Torre Guaceto</h3>
                    <span class="distance-tag">20 min</span>
                </div>
                <p class="dest-description" 
                   data-it="Oasi protetta con spiagge selvagge e acque cristalline." 
                   data-en="Protected oasis with wild beaches and crystal-clear waters."></p>
                <a href="https://maps.google.com" target="_blank" class="maps-btn">
                    <span class="material-symbols-outlined" style="margin-right: 6px; font-size: 16px;">location_on</span>
                    <span data-it="Posizione" data-en="Location">Posizione</span>
                </a>
            </div>

            <div class="destination-card">
                <div class="dest-header">
                    <h3>Lecce</h3>
                    <span class="distance-tag">30 min</span>
                </div>
                <p class="dest-description" 
                   data-it="La 'Firenze del Sud', trionfo del Barocco e dell'arte." 
                   data-en="The 'Florence of the South', a triumph of Baroque art and architecture."></p>
                <a href="https://maps.google.com" target="_blank" class="maps-btn">
                    <span class="material-symbols-outlined" style="margin-right: 6px; font-size: 16px;">location_on</span>
                    <span data-it="Posizione" data-en="Location">Posizione</span>
                </a>
            </div>

        </div>

        <div class="back-btn-container">
            <a href="menu.html" class="back-btn">
                <span class="material-symbols-outlined">arrow_back_ios_new</span>
                <span data-it="Torna alla home" data-en="Back to home">Torna alla home</span>
            </a>
        </div>
    </div>

    <script>
        function setLanguage(lang) {
            localStorage.setItem('preferredLang', lang);
            document.getElementById('btn-it').classList.toggle('active', lang === 'it');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');

            document.querySelectorAll('[data-it]').forEach(el => {
                el.textContent = el.getAttribute('data-' + lang);
            });
        }

        window.onload = () => {
            const savedLang = localStorage.getItem('preferredLang') || 'it';
            setLanguage(savedLang);
        };
    </script>

</body>
</html>
