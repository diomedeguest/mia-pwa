<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Istruzioni Macchina del Caffè - Diomede Luxury</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Open+Sans:wght@300;400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

    <div class="lang-switcher">
        <div id="btn-it" class="lang-btn" onclick="setLanguage('it')">ITA</div>
        <div id="btn-en" class="lang-btn" onclick="setLanguage('en')">ENG</div>
    </div>

    <div class="hero-header">
        <img src="../../assets/images/header.png" alt="Diomede Luxury Logo" class="logo-img">
        <div class="hero-overlay"></div>
    </div>

    <div class="container">
        <div class="header-content">
            <h2 data-it="Macchina del Caffè" data-en="Coffee Machine">Macchina del Caffè</h2>
            <div class="divider"></div>
        </div>

        <div class="image-container">
            <img src="../../assets/images/macchina-caffe.png" alt="Macchina del Caffè" class="instruction-image">
        </div>

        <div class="instruction-section">
            <div class="instruction-card">
                <h3>
                    <span class="material-symbols-outlined">water_drop</span> 
                    <span data-it="1. Preparazione" data-en="1. Preparation">1. Preparazione</span>
                </h3>
                <ul class="step-list">
                    <li>
                        <span class="material-symbols-outlined item-icon">opacity</span>
                        <div>
                            <strong data-it="Serbatoio" data-en="Water Tank">Serbatoio</strong>
                            <span data-it="Controlla che il serbatoio sul retro sia pieno d'acqua naturale." data-en="Check that the tank on the back is filled with still water."></span>
                        </div>
                    </li>
                    <li>
                        <span class="material-symbols-outlined item-icon">ev_shadow</span>
                        <div>
                            <strong data-it="Capsula" data-en="Capsule">Capsula</strong>
                            <span data-it="Inserisci la capsula nell'apposito vano situato nella parte superiore." data-en="Insert the capsule into the compartment located at the top."></span>
                        </div>
                    </li>
                </ul>
            </div>

            <div class="instruction-card">
                <h3>
                    <span class="material-symbols-outlined">coffee_maker</span> 
                    <span data-it="2. Erogazione" data-en="2. Brewing">2. Erogazione</span>
                </h3>
                <ul class="step-list">
                    <li>
                        <span class="material-symbols-outlined item-icon">coffee</span>
                        <div>
                            <strong data-it="Avvio" data-en="Start">Avvio</strong>
                            <span data-it="Posiziona la tazzina e premi il tasto desiderato (Singolo o Doppio)." data-en="Place your cup and press the desired button (Single or Double)."></span>
                        </div>
                    </li>
                    <li>
                        <span class="material-symbols-outlined item-icon">hourglass_empty</span>
                        <div>
                            <strong data-it="Riscaldamento" data-en="Heating">Riscaldamento</strong>
                            <span data-it="Se le luci lampeggiano, attendi che diventino fisse prima di premere." data-en="If the lights are flashing, wait until they stay on before pressing."></span>
                        </div>
                    </li>
                </ul>
            </div>

            <div class="instruction-card full-width-tablet">
                <h3>
                    <span class="material-symbols-outlined">info</span> 
                    <span data-it="Consigli utili" data-en="Useful Tips">Consigli utili</span>
                </h3>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px;">
                    <div class="alert-box">
                        <h4 data-it="Espulsione" data-en="Ejection">Espulsione</h4>
                        <p data-it="Al termine dell'erogazione, solleva e abbassa la leva per espellere la capsula usata." data-en="When finished, lift and lower the lever to eject the used capsule."></p>
                    </div>
                    <div class="alert-box">
                        <h4 data-it="Pulizia" data-en="Cleaning">Pulizia</h4>
                        <p data-it="Svuota periodicamente il cassetto raccogli-capsule per evitare inceppamenti." data-en="Periodically empty the capsule drawer to avoid jams."></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="back-btn-container">
            <a href="../istruzioni.html" class="back-btn">
                <span class="material-symbols-outlined">arrow_back_ios_new</span>
                <span data-it="Torna alle istruzioni" data-en="Back to instructions">Torna alle istruzioni</span>
            </a>
        </div>
    </div>

    <script>
        function setLanguage(lang) {
            localStorage.setItem('preferredLang', lang);
            const btnIt = document.getElementById('btn-it');
            const btnEn = document.getElementById('btn-en');
            
            if(btnIt) btnIt.classList.toggle('active', lang === 'it');
            if(btnEn) btnEn.classList.toggle('active', lang === 'en');

            document.querySelectorAll('[data-it]').forEach(el => {
                const text = el.getAttribute('data-' + lang);
                el.textContent = text;
            });
        }

        window.onload = () => {
            const savedLang = localStorage.getItem('preferredLang') || 'it';
            setLanguage(savedLang);
        };
    </script>

</body>
</html>
