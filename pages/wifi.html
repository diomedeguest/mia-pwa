<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Wi-Fi - Diomede Luxury</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Open+Sans:wght@400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,200,0,0&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Open Sans', sans-serif; 
            margin: 0; padding: 0; 
            background-color: #F0EDE9; 
            color: #1a1a1a;
            line-height: 1.4;
            text-align: center;
        }

        /* HEADER - Standardizzato con logo centrato */
        .hero-header {
            width: 100%;
            height: 240px; 
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px 20px;
            overflow: hidden;
        }

        .logo-img {
            width: 100%;
            max-width: 300px; 
            height: auto;
            z-index: 5;
            display: block;
        }

        .hero-overlay {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 60px;
            background: linear-gradient(to top, #F0EDE9, rgba(240, 237, 233, 0));
        }

        /* CONTAINER */
        .container { 
            width: 100%; 
            max-width: 900px; 
            margin: -30px auto 0; 
            padding: 0 20px 80px;
            position: relative;
            z-index: 10;
        }

        h2 { 
            font-family: 'PT Serif', serif; 
            font-size: 34px; 
            margin: 0; 
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #2c2c2c;
        }
        
        .divider { width: 50px; height: 1px; background-color: #A39689; margin: 15px auto 35px; }

        .info-box { 
            display: grid; 
            gap: 15px; 
            grid-template-columns: 1fr; 
            margin-top: 10px;
        }
        
        @media (min-width: 768px) {
            .hero-header { height: 280px; }
            .logo-img { max-width: 400px; }
            .container { margin-top: -40px; }
            .info-box { grid-template-columns: 1fr 1fr; gap: 20px; }
            h2 { font-size: 40px; }
        }

        /* CARD Wi-Fi */
        .wifi-card {
            background-color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(163, 150, 137, 0.3);
            border-radius: 20px;
            padding: 25px;
            text-align: left;
            display: flex;
            flex-direction: column;
        }

        .label-group { 
            display: flex; 
            align-items: center; 
            margin-bottom: 12px; 
        }

        .wifi-card .material-symbols-outlined { 
            font-size: 24px; 
            margin-right: 12px; 
            color: #A39689; 
            font-variation-settings: 'wght' 300; 
        }

        .label { 
            font-size: 11px; 
            text-transform: uppercase; 
            font-weight: 700; 
            letter-spacing: 1.2px; 
            color: #888;
        }

        .value { 
            font-size: 18px; 
            font-weight: 600; 
            padding-left: 36px; 
            display: block; 
            word-break: break-all;
            color: #1a1a1a;
        }

        /* PULSANTE BACK - Sfondo Tortora e Scritta Bianca */
        .back-btn-container { 
            margin-top: 50px; 
            display: flex;
            justify-content: center;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 40px;
            background-color: #A39689; /* SFONDO TORTORA */
            color: #ffffff;            /* SCRITTA BIANCA */
            text-decoration: none;
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            border-radius: 50px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .back-btn:active { 
            transform: scale(0.96); 
            background-color: #8D8378; 
        }

        .back-btn .material-symbols-outlined {
            margin-right: 10px;
            font-size: 16px;
            color: #ffffff; /* ICONA BIANCA */
            font-variation-settings: 'wght' 500;
        }
    </style>
</head>
<body>

    <div class="hero-header">
        <img src="../assets/images/header.png" alt="Diomede Luxury Logo" class="logo-img">
        <div class="hero-overlay"></div>
    </div>

    <div class="container">
        <h2>Wi-Fi</h2>
        <div class="divider"></div>

        <div class="info-box">
            <div class="wifi-card">
                <div class="label-group">
                    <span class="material-symbols-outlined">wifi</span>
                    <span class="label">Nome Rete</span>
                </div>
                <span class="value">Diomede_Luxury_Guest</span>
            </div>

            <div class="wifi-card">
                <div class="label-group">
                    <span class="material-symbols-outlined">key</span>
                    <span class="label">Password</span>
                </div>
                <span class="value">StayAtDiomede2!</span>
            </div>
        </div>

        <div class="back-btn-container">
            <a href="menu.html" class="back-btn">
                <span class="material-symbols-outlined">arrow_back_ios_new</span>
                Torna alla home
            </a>
        </div>
    </div>

</body>
</html>
