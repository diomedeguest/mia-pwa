<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Diomede Luxury - Menu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Open+Sans:wght@400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,200,0,0&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'PT Serif', Georgia, serif; 
            margin: 0; 
            padding: 15px 20px 40px; /* Ridotto padding superiore da 40px a 15px */
            text-align: center; 
            background-color: #ffffff; 
            color: #000000;
        }
        
        .logo-box { 
            margin-bottom: 20px; /* Ridotto margine sotto il logo da 40px a 20px */
            min-height: auto;    /* Rimosso min-height da 100px */
        }

        .logo-img { 
            max-width: 190px;    /* Leggermente più piccolo per guadagnare spazio su mobile */
            height: auto; 
        }
        
        /* Griglia Mobile (3 colonne) */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 25px 10px; 
            max-width: 450px; 
            margin: 0 auto; 
        }
        
        /* Adattamento TABLET */
        @media (min-width: 700px) {
            body { padding-top: 30px; }
            .grid {
                grid-template-columns: repeat(3, 1fr);
                max-width: 700px;
                gap: 40px 30px;
            }
            .logo-img { max-width: 260px; }
            .circle { width: 90px !important; height: 90px !important; }
            .material-symbols-outlined { font-size: 36px !important; }
            span.label { font-size: 11px !important; }
        }
        
        .btn { 
            text-decoration: none; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            transition: transform 0.2s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }
        
        .circle { 
            width: 70px; /* Ridotto leggermente da 75px a 70px */
            height: 70px; 
            background-color: #FBFBFB; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin-bottom: 8px; 
            color: #000000; 
            border: 1px solid #EAEAEA; 
        }

        .material-symbols-outlined { 
            font-size: 28px; 
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 48;
        }
        
        span.label { 
            font-family: 'Open Sans', sans-serif; 
            font-size: 9px; 
            color: #000000; 
            text-transform: uppercase; 
            font-weight: 600; 
            letter-spacing: 0.5px;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div class="logo-box">
        <img src="../assets/images/logo.png" alt="Diomede Luxury" class="logo-img">
    </div>

    <div class="grid">
        <a href="dettagli.html" class="btn">
            <div class="circle"><span class="material-symbols-outlined">home</span></div>
            <span class="label">Dotazioni e Servizi</span>
        </a>

        <a href="contatti.html" class="btn">
            <div class="circle"><span class="material-symbols-outlined">call</span></div>
            <span class="label">Contatti</span>
        </a>

        <a href="regole.html" class="btn">
            <div class="circle"><span class="material-symbols-outlined">gavel</span></div>
            <span class="label">Regole Casa</span>
        </a>

        <a href="istruzioni.html" class="btn">
            <div class="circle"><span class="material-symbols-outlined">menu_book</span></div>
            <span class="label">Istruzioni</span>
        </a>

        <a href="wifi.html" class="btn">
            <div class="circle"><span class="material-symbols-outlined">wifi</span></div>
            <span class="label">Wi-Fi</span>
        </a>

        <a href="trasporti.html" class="btn">
            <div class="circle"><span class="material-symbols-outlined">directions_bus</span></div>
            <span class="label">Trasporti</span>
        </a>

        <a href="turismo.html" class="btn">
            <div class="circle"><span class="material-symbols-outlined">explore</span></div>
            <span class="label">Cosa vedere</span>
        </a>

        <a href="convenzioni.html" class="btn">
            <div class="circle"><span class="material-symbols-outlined">sell</span></div>
            <span class="label">Convenzioni</span>
        </a>

        <a href="checkout.html" class="btn">
            <div class="circle"><span class="material-symbols-outlined">logout</span></div>
            <span class="label">Check-Out</span>
        </a>
    </div>

</body>
</html>
