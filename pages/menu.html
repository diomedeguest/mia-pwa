<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Menu - Diomede Luxury</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Open+Sans:wght@400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,200,0,0&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Open Sans', sans-serif; 
            margin: 0; padding: 0; 
            /* TORTORA FANGO SCURO */
            background-color: #A39689; 
            color: #000000;
            text-align: center;
        }

        .hero-header {
            width: 100%;
            height: 170px; 
            background: url('../assets/images/header.png') no-repeat center center;
            background-size: cover;
            position: relative;
        }

        .hero-overlay {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 70px;
            /* Gradiente aggiornato per il tortora fango */
            background: linear-gradient(to top, #A39689, rgba(163, 150, 137, 0));
        }

        .container { 
            width: 100%; 
            max-width: 450px; 
            margin: -15px auto 0; 
            padding: 0 20px 50px;
            position: relative;
            z-index: 10;
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 25px 10px; 
            margin-top: 20px;
        }
        
        @media (min-width: 700px) {
            .hero-header { height: 240px; }
            .container { max-width: 700px; }
            .grid { gap: 40px 30px; margin-top: 30px; }
            .circle { width: 95px !important; height: 95px !important; }
            .material-symbols-outlined { font-size: 38px !important; }
            span.label { font-size: 11px !important; }
        }
        
        .btn { 
            text-decoration: none; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            transition: transform 0.2s ease;
        }

        /* CERCHIO: Leggermente più chiaro dello sfondo per creare rilievo */
        .circle { 
            width: 75px; 
            height: 75px; 
            background-color: rgba(255, 255, 255, 0.15); 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin-bottom: 10px; 
            color: #000000; /* Icone nere per massimo contrasto */
            border: 1px solid rgba(0, 0, 0, 0.1); 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px); /* Effetto vetro satinato */
        }

        .material-symbols-outlined { 
            font-size: 28px; 
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 48;
        }
        
        span.label { 
            font-family: 'Open Sans', sans-serif; 
            font-size: 9px; 
            color: #000000; 
            text-transform: uppercase; 
            font-weight: 700; 
            letter-spacing: 0.8px;
            line-height: 1.2;
        }

        /* Effetto al tocco */
        .btn:active .circle {
            transform: scale(0.92);
            background-color: rgba(0, 0, 0, 0.1);
            border-color: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="hero-header">
        <div class="hero-overlay"></div>
    </div>

    <div class="container">
        <div class="grid">
            <a href="dettagli.html" class="btn">
                <div class="circle"><span class="material-symbols-outlined">home</span></div>
                <span class="label">Dotazioni e Servizi</span>
            </a>
            <a href="contatti.html" class="btn">
                <div class="circle"><span class="material-symbols-outlined">call</span></div>
                <span class="label">Contatti</span>
            </a>
            <a href="regole.html" class="btn">
                <div class="circle"><span class="material-symbols-outlined">gavel</span></div>
                <span class="label">Regole Casa</span>
            </a>
            <a href="istruzioni.html" class="btn">
                <div class="circle"><span class="material-symbols-outlined">menu_book</span></div>
                <span class="label">Istruzioni</span>
            </a>
            <a href="wifi.html" class="btn">
                <div class="circle"><span class="material-symbols-outlined">wifi</span></div>
                <span class="label">Wi-Fi</span>
            </a>
            <a href="trasporti.html" class="btn">
                <div class="circle"><span class="material-symbols-outlined">directions_bus</span></div>
                <span class="label">Trasporti</span>
            </a>
            <a href="turismo.html" class="btn">
                <div class="circle"><span class="material-symbols-outlined">explore</span></div>
                <span class="label">Esplora il Territorio</span>
            </a>
            <a href="convenzioni.html" class="btn">
                <div class="circle"><span class="material-symbols-outlined">sell</span></div>
                <span class="label">I Nostri Partner</span>
            </a>
            <a href="checkout.html" class="btn">
                <div class="circle"><span class="material-symbols-outlined">logout</span></div>
                <span class="label">Check-Out</span>
            </a>
        </div>
    </div>

</body>
</html>
