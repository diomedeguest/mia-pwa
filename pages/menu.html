<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Menu - Diomede Luxury</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Open+Sans:wght@400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,200,0,0&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.18);
            --glass-border: rgba(255, 255, 255, 0.25);
            --bg-overlay: rgba(0, 0, 0, 0.4);
            --primary-font: 'Open Sans', sans-serif;
            --elegant-font: 'PT Serif', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body, html {
            height: var(--app-height, 100dvh);
            min-height: var(--app-height, 100dvh);
            font-family: var(--primary-font);
            color: white;
            overflow: hidden;
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)),
                        url('../assets/images/sfondo.png') center/cover no-repeat fixed;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: var(--app-height, 100dvh);
            min-height: var(--app-height, 100dvh);
            padding:
                env(safe-area-inset-top)
                15px
                max(15px, env(safe-area-inset-bottom))
                15px;
        }

        .header-wrapper {
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 126px;
            padding-top: 30px;
        }

        .logo-img {
            width: 64%;
            max-width: 242px;
            height: auto;
            margin-top: -4px;
            animation: logoFadeIn 1s ease-out forwards;
        }

        .lang-switcher {
            position: absolute;
            right: 4px;
            top: 30px;
            display: flex;
            gap: 5px;
            z-index: 10;
        }

        .lang-btn {
            width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(0,0,0,0.2);
            color: white; font-size: 8px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(8px);
        }

        .lang-btn.active { background: white; color: black; border-color: white; }

        .welcome-section { text-align: center; margin-top: -2px; }
        .welcome-text {
            transition: opacity .2s ease, transform .25s ease;
            font-family: var(--elegant-font);
            font-size: 31px;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0.35px;
            line-height: 1.05;
            text-shadow: 0 2px 12px rgba(0,0,0,0.45);
        }

        .subtitle {
            font-family: var(--elegant-font);
            font-size: 13.5px;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 0.12px;
            line-height: 1.45;
            margin: 7px auto 4px;
            max-width: 330px;
            text-shadow: 0 1px 8px rgba(0,0,0,0.45);
            opacity: 0.96;
        }

        #main-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px 10px;
            width: 100%;
            max-width: 380px;
            margin: 3px 0 4px;
        }

        .btn {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
        }

        .circle {
            width: 65px; height: 65px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 6px; transition: 0.2s;
        }

        .material-symbols-outlined { font-size: 26px; }
        .label { font-size: 8.5px; text-transform: uppercase; font-weight: 700; text-align: center; }

        .weather-widget {
            display: flex; align-items: center; gap: 7px;
            padding: 5px 13px; background: rgba(255,255,255,0.12);
            backdrop-filter: blur(15px); border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            text-decoration: none; color: white;
            margin-bottom: 36px;
        }

        .temp-val { font-size: 13px; font-weight: 600; font-family: var(--elegant-font); }
        .city-name { font-family: var(--elegant-font); font-size: 10.5px; border-left: 1px solid rgba(255,255,255,0.3); padding-left: 7px; }

        .weather-widget .material-symbols-outlined { font-size: 19px; }
        .weather-widget #description { font-size: 10.5px; }

        @media (max-height: 700px) {
            .header-wrapper { min-height: 98px; padding-top: 20px; }
            .lang-switcher { top: 20px; right: 4px; }
            .logo-img { width: 56%; max-width: 210px; margin-top: -6px; }
            .welcome-section { margin-top: 0; }
            .welcome-text { font-size: 27px; }
            .subtitle { font-size: 12px; line-height: 1.4; }
            #main-grid { gap: 8px 8px; }
            .circle { width: 58px; height: 58px; }
            .weather-widget { margin-bottom: 24px; }
        }


        /* TABLET LAYOUT */
        @media (min-width: 700px) and (orientation: landscape) {
            .container {
                padding: 0 28px 18px;
                justify-content: space-between;
            }

            .header-wrapper {
                min-height: 132px;
                padding-top: 24px;
                flex-shrink: 0;
            }

            .logo-img {
                width: 38%;
                max-width: 270px;
                margin-top: 0;
            }

            .lang-switcher {
                top: 26px;
                right: 10px;
            }

            .welcome-section {
                margin-top: -2px;
                margin-bottom: 4px;
                flex-shrink: 0;
            }

            .welcome-text {
                font-size: 29px;
            }

            .subtitle {
                max-width: 500px;
                font-size: 12.5px;
                line-height: 1.4;
            }

            #main-grid {
                grid-template-columns: repeat(3, minmax(120px, 1fr));
                column-gap: 36px;
                row-gap: 14px;
                width: min(620px, 84vw);
                max-width: none;
                margin: 4px auto 6px;
                align-items: start;
                flex-shrink: 1;
            }

            .btn {
                min-width: 0;
            }

            .circle {
                width: 70px;
                height: 70px;
                margin-bottom: 7px;
            }

            .material-symbols-outlined {
                font-size: 28px;
            }

            .label {
                font-size: 9px;
                line-height: 1.2;
                letter-spacing: .3px;
            }

            .weather-widget {
                margin-bottom: 14px;
                padding: 5px 14px;
                flex-shrink: 0;
            }
        }

        @media (min-width: 700px) and (orientation: portrait) {
            #main-grid {
                grid-template-columns: repeat(3, 1fr);
                width: min(520px, 88vw);
                gap: 18px 22px;
                max-width: none;
            }

            .circle {
                width: 74px;
                height: 74px;
            }

            .label {
                font-size: 9.2px;
            }

            .weather-widget {
                margin-bottom: 24px;
            }
        }

        @media (min-width: 1000px) and (orientation: landscape) {
            #main-grid {
                width: min(700px, 80vw);
                column-gap: 46px;
                row-gap: 16px;
            }

            .circle {
                width: 74px;
                height: 74px;
            }
        }

        @keyframes logoFadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    

        /* ==========================================================
           MOBILE LANDSCAPE DEFINITIVO
           Applicato SOLO quando JS rileva un telefono in orizzontale.
           Il portrait non viene toccato.
           ========================================================== */
        body.diomede-mobile-landscape,
        body.diomede-mobile-landscape html {
            overflow: hidden !important;
        }

        body.diomede-mobile-landscape .container {
            display: grid !important;
            grid-template-columns: clamp(138px, 23vw, 180px) minmax(0, 1fr) !important;
            grid-template-rows: 1fr auto auto auto 1fr !important;
            grid-template-areas:
                ". menu"
                "brand menu"
                "welcome menu"
                "weather menu"
                ". menu" !important;
            width: 100% !important;
            height: 100dvh !important;
            min-height: 0 !important;
            max-height: 100dvh !important;
            padding:
                max(6px, env(safe-area-inset-top))
                max(11px, env(safe-area-inset-right))
                max(6px, env(safe-area-inset-bottom))
                max(11px, env(safe-area-inset-left)) !important;
            column-gap: clamp(8px, 1.7vw, 14px) !important;
            row-gap: 2px !important;
            align-items: center !important;
            justify-items: center !important;
            overflow: hidden !important;
        }

        /* Brand a sinistra, completamente trasparente */
        body.diomede-mobile-landscape .header-wrapper {
            grid-area: brand !important;
            position: relative !important;
            width: 100% !important;
            height: auto !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background: transparent !important;
            border: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        body.diomede-mobile-landscape .logo-img {
            display: block !important;
            width: min(92%, 156px) !important;
            max-width: 156px !important;
            max-height: 66px !important;
            height: auto !important;
            object-fit: contain !important;
            margin: 0 !important;
            filter: drop-shadow(0 4px 11px rgba(0,0,0,.20)) !important;
        }

        /* Saluto direttamente sotto il logo */
        body.diomede-mobile-landscape .welcome-section {
            grid-area: welcome !important;
            width: 100% !important;
            margin: 0 !important;
            padding: 0 2px !important;
            text-align: center !important;
        }

        body.diomede-mobile-landscape .welcome-text {
            margin: 0 !important;
            font-size: clamp(16.5px, 5.1vh, 21px) !important;
            line-height: 1 !important;
        }

        body.diomede-mobile-landscape .subtitle {
            max-width: 166px !important;
            margin: 3px auto 0 !important;
            font-size: clamp(6.8px, 1.82vh, 8.2px) !important;
            line-height: 1.13 !important;
        }

        /* Meteo compatto sotto il saluto */
        body.diomede-mobile-landscape .weather-widget {
            grid-area: weather !important;
            align-self: center !important;
            justify-self: center !important;
            margin: 3px 0 0 !important;
            padding: 3px 7px !important;
            gap: 5px !important;
            max-width: 168px !important;
        }

        body.diomede-mobile-landscape .weather-widget .material-symbols-outlined {
            font-size: 14px !important;
        }

        body.diomede-mobile-landscape .weather-widget #description,
        body.diomede-mobile-landscape .city-name {
            font-size: 7.4px !important;
        }

        body.diomede-mobile-landscape .temp-val {
            font-size: 9.7px !important;
        }

        /* 3 x 3 compatto: tutte e 9 le icone restano dentro il viewport */
        body.diomede-mobile-landscape #main-grid {
            grid-area: menu !important;
            display: grid !important;
            grid-template-columns: repeat(3, minmax(74px, 92px)) !important;
            grid-template-rows: repeat(3, minmax(0, 1fr)) !important;
            justify-content: center !important;
            align-content: stretch !important;
            place-items: center !important;
            width: min(100%, 326px) !important;
            max-width: 326px !important;
            height: min(82vh, 300px) !important;
            min-height: 0 !important;
            max-height: 300px !important;
            margin: 0 auto !important;
            padding: 0 !important;
            column-gap: clamp(7px, 1.25vw, 11px) !important;
            row-gap: 0 !important;
            overflow: visible !important;
            align-self: center !important;
            justify-self: center !important;
        }

        body.diomede-mobile-landscape #main-grid .btn {
            width: 100% !important;
            height: 100% !important;
            min-width: 0 !important;
            min-height: 0 !important;
            margin: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
        }

        body.diomede-mobile-landscape .circle {
            width: clamp(46px, 14vh, 58px) !important;
            height: clamp(46px, 14vh, 58px) !important;
            margin: 0 0 3px !important;
            flex: 0 0 auto !important;
            background: rgba(255,255,255,.17) !important;
            border: 1px solid rgba(255,255,255,.34) !important;
            box-shadow: 0 7px 19px rgba(0,0,0,.17) !important;
        }

        body.diomede-mobile-landscape #main-grid .material-symbols-outlined {
            font-size: clamp(20px, 6vh, 25px) !important;
        }

        body.diomede-mobile-landscape .label {
            max-width: 100% !important;
            min-height: 0 !important;
            font-size: clamp(6.3px, 1.65vh, 7.6px) !important;
            line-height: 1.04 !important;
            letter-spacing: .12px !important;
            white-space: normal !important;
        }

        /* Lingua indipendente dal layout */
        body.diomede-mobile-landscape .lang-switcher {
            position: fixed !important;
            top: max(7px, env(safe-area-inset-top)) !important;
            right: max(9px, env(safe-area-inset-right)) !important;
            left: auto !important;
            z-index: 60 !important;
        }

        body.diomede-mobile-landscape .lang-btn {
            width: 28px !important;
            height: 28px !important;
            font-size: 7px !important;
        }

        /* Per telefoni molto bassi (es. 320–360 px di altezza) */
        body.diomede-mobile-landscape.diomede-landscape-short .container {
            grid-template-columns: clamp(126px, 22vw, 158px) minmax(0, 1fr) !important;
            column-gap: 6px !important;
        }

        body.diomede-mobile-landscape.diomede-landscape-short .logo-img {
            width: min(92%, 140px) !important;
            max-width: 140px !important;
            max-height: 58px !important;
        }

        body.diomede-mobile-landscape.diomede-landscape-short .welcome-text {
            font-size: clamp(15.5px, 5vh, 19px) !important;
        }

        body.diomede-mobile-landscape.diomede-landscape-short .subtitle {
            max-width: 150px !important;
            margin-top: 2px !important;
            font-size: clamp(6.3px, 1.78vh, 7.4px) !important;
        }

        body.diomede-mobile-landscape.diomede-landscape-short #main-grid {
            grid-template-columns: repeat(3, minmax(70px, 86px)) !important;
            width: min(100%, 300px) !important;
            max-width: 300px !important;
            height: min(80vh, 270px) !important;
            max-height: 270px !important;
            column-gap: 6px !important;
        }

        body.diomede-mobile-landscape.diomede-landscape-short .circle {
            width: clamp(43px, 13.5vh, 49px) !important;
            height: clamp(43px, 13.5vh, 49px) !important;
        }

        body.diomede-mobile-landscape.diomede-landscape-short #main-grid .material-symbols-outlined {
            font-size: clamp(19px, 5.8vh, 23px) !important;
        }

        body.diomede-mobile-landscape.diomede-landscape-short .label {
            font-size: clamp(6.1px, 1.62vh, 7px) !important;
        }



        /* ==========================================================
           OVERRIDE richiesto: in landscape mobile
           - logo e scritta "Buonasera" a sinistra, centrati verticalmente
           - solo 9 icone a destra, tutte visibili
           - il portrait resta invariato
           ========================================================== */
        body.diomede-mobile-landscape .container {
            grid-template-columns: clamp(118px, 21vw, 150px) minmax(0, 1fr) !important;
            grid-template-rows: 1fr !important;
            grid-template-areas: "brandbox menu" !important;
            column-gap: clamp(8px, 1.4vw, 12px) !important;
            row-gap: 0 !important;
            align-items: center !important;
            justify-items: center !important;
        }

        /* Creo un blocco sinistro compatto usando elementi esistenti */
        body.diomede-mobile-landscape .header-wrapper {
            grid-area: brandbox !important;
            align-self: center !important;
            justify-self: center !important;
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        body.diomede-mobile-landscape .welcome-section {
            grid-area: brandbox !important;
            align-self: center !important;
            justify-self: center !important;
            width: 100% !important;
            margin-top: 62px !important;
            padding: 0 !important;
            text-align: center !important;
            pointer-events: none !important;
        }

        body.diomede-mobile-landscape .logo-img {
            width: min(88%, 130px) !important;
            max-width: 130px !important;
            max-height: 54px !important;
            margin: 0 auto !important;
        }

        body.diomede-mobile-landscape .welcome-text {
            margin: 6px 0 0 !important;
            font-size: clamp(15px, 4.6vh, 19px) !important;
            line-height: 1.05 !important;
        }

        /* Tolgo sottotitolo e meteo in landscape per recuperare spazio */
        body.diomede-mobile-landscape .subtitle,
        body.diomede-mobile-landscape .weather-widget {
            display: none !important;
        }

        body.diomede-mobile-landscape #main-grid {
            grid-area: menu !important;
            width: min(100%, 326px) !important;
            max-width: 326px !important;
            height: min(84vh, 305px) !important;
            max-height: 305px !important;
            grid-template-columns: repeat(3, minmax(74px, 92px)) !important;
            grid-template-rows: repeat(3, minmax(0, 1fr)) !important;
            column-gap: clamp(7px, 1.2vw, 10px) !important;
            row-gap: 0 !important;
            align-self: center !important;
            justify-self: center !important;
        }

        body.diomede-mobile-landscape .circle {
            width: clamp(46px, 13.8vh, 56px) !important;
            height: clamp(46px, 13.8vh, 56px) !important;
            margin: 0 0 3px !important;
        }

        body.diomede-mobile-landscape #main-grid .material-symbols-outlined {
            font-size: clamp(20px, 5.8vh, 24px) !important;
        }

        body.diomede-mobile-landscape .label {
            font-size: clamp(6.3px, 1.6vh, 7.5px) !important;
            line-height: 1.05 !important;
        }

        body.diomede-mobile-landscape .lang-switcher {
            top: max(8px, env(safe-area-inset-top)) !important;
            right: max(8px, env(safe-area-inset-right)) !important;
            z-index: 60 !important;
        }

        /* Telefoni molto bassi */
        body.diomede-mobile-landscape.diomede-landscape-short .container {
            grid-template-columns: 112px minmax(0, 1fr) !important;
            column-gap: 6px !important;
        }

        body.diomede-mobile-landscape.diomede-landscape-short .logo-img {
            max-width: 118px !important;
            max-height: 48px !important;
        }

        body.diomede-mobile-landscape.diomede-landscape-short .welcome-section {
            margin-top: 56px !important;
        }

        body.diomede-mobile-landscape.diomede-landscape-short .welcome-text {
            font-size: clamp(14px, 4.4vh, 17px) !important;
        }

        body.diomede-mobile-landscape.diomede-landscape-short #main-grid {
            width: min(100%, 300px) !important;
            max-width: 300px !important;
            height: min(82vh, 272px) !important;
            max-height: 272px !important;
            grid-template-columns: repeat(3, minmax(69px, 86px)) !important;
            column-gap: 6px !important;
        }

        body.diomede-mobile-landscape.diomede-landscape-short .circle {
            width: clamp(42px, 13vh, 49px) !important;
            height: clamp(42px, 13vh, 49px) !important;
        }

        body.diomede-mobile-landscape.diomede-landscape-short .label {
            font-size: clamp(6px, 1.55vh, 6.9px) !important;
        }



        /* ==========================================================
           LANDSCAPE PREMIUM FINALE — solo mobile orizzontale
           Portrait completamente invariato.
           ========================================================== */

        body.diomede-mobile-landscape .container {
            grid-template-columns: clamp(120px, 20vw, 146px) minmax(0, 1fr) !important;
            grid-template-rows: 1fr !important;
            grid-template-areas: "brandbox menu" !important;
            column-gap: clamp(10px, 1.7vw, 14px) !important;
            align-items: center !important;
            justify-items: center !important;
            padding-left: max(12px, env(safe-area-inset-left)) !important;
            padding-right: max(12px, env(safe-area-inset-right)) !important;
        }

        /* Blocco sinistro più equilibrato e centrato realmente in altezza */
        body.diomede-mobile-landscape .header-wrapper {
            grid-area: brandbox !important;
            align-self: center !important;
            justify-self: center !important;
            width: 100% !important;
            transform: translateY(-18px);
        }

        body.diomede-mobile-landscape .welcome-section {
            grid-area: brandbox !important;
            align-self: center !important;
            justify-self: center !important;
            width: 100% !important;
            margin: 64px 0 0 !important;
            padding: 0 2px !important;
            transform: translateY(-18px);
        }

        body.diomede-mobile-landscape .logo-img {
            width: min(94%, 138px) !important;
            max-width: 138px !important;
            max-height: 58px !important;
            margin: 0 auto !important;
            filter: drop-shadow(0 4px 13px rgba(0,0,0,.24)) !important;
        }

        body.diomede-mobile-landscape .welcome-text {
            margin: 7px 0 0 !important;
            font-size: clamp(16px, 4.8vh, 20px) !important;
            line-height: 1 !important;
            letter-spacing: .25px !important;
            text-shadow: 0 2px 9px rgba(0,0,0,.44) !important;
        }

        /* Nel landscape mobile lasciamo solo ciò che serve davvero */
        body.diomede-mobile-landscape .subtitle,
        body.diomede-mobile-landscape .weather-widget {
            display: none !important;
        }

        /* Griglia 3x3: più grande ma molto più compatta e regolare */
        body.diomede-mobile-landscape #main-grid {
            grid-area: menu !important;
            display: grid !important;
            grid-template-columns: repeat(3, minmax(82px, 104px)) !important;
            grid-template-rows: repeat(3, minmax(0, 1fr)) !important;
            width: min(100%, 354px) !important;
            max-width: 354px !important;
            height: min(86vh, 310px) !important;
            max-height: 310px !important;
            margin: 0 auto !important;
            padding: 0 !important;
            column-gap: clamp(8px, 1.25vw, 11px) !important;
            row-gap: 0 !important;
            place-items: center !important;
            align-self: center !important;
            justify-self: center !important;
        }

        body.diomede-mobile-landscape #main-grid .btn {
            width: 100% !important;
            height: 100% !important;
            min-width: 0 !important;

<body>

    <script>
        const MENU_ITEMS = [
            { id: 'wifi',        icon: 'wifi',           it: 'Wi-Fi',        en: 'Wi-Fi' },
            { id: 'istruzioni',  icon: 'menu_book',      it: 'Istruzioni',   en: 'Instructions' },
            { id: 'contatti',    icon: 'call',           it: 'Contatti',     en: 'Contacts' },
            { id: 'dettagli',    icon: 'home',           it: 'Dotazioni',    en: 'Amenities' },
            { id: 'regole',      icon: 'gavel',          it: 'Regole',       en: 'House Rules' },
            { id: 'trasporti',   icon: 'directions_bus', it: 'Trasporti',    en: 'Transport' },
            { id: 'turismo',     icon: 'explore',        it: 'Territorio',  en: 'Explore' },
            { id: 'convenzioni', icon: 'sell',           it: 'Partner',      en: 'Partners' },
            { id: 'checkout',    icon: 'rate_review',    it: 'La tua opinione conta',  en: 'Your opinion matters' }
        ];

        const weatherMap = {
            0:  { icon: 'wb_sunny',          it: 'Sereno',        en: 'Clear' },
            1:  { icon: 'light_mode',        it: 'Poco nuvoloso', en: 'Mostly clear' },
            2:  { icon: 'partly_cloudy_day', it: 'Parz. nuvoloso',en: 'Partly cloudy' },
            3:  { icon: 'cloud',             it: 'Nuvoloso',      en: 'Cloudy' },
            45: { icon: 'foggy',             it: 'Nebbia',        en: 'Fog' },
            48: { icon: 'foggy',             it: 'Brina',         en: 'Rime fog' },
            51: { icon: 'rainy',             it: 'Pioviggine',    en: 'Drizzle' },
            53: { icon: 'rainy',             it: 'Pioviggine',    en: 'Drizzle' },
            55: { icon: 'rainy',             it: 'Pioviggine',    en: 'Drizzle' },
            56: { icon: 'rainy',             it: 'Pioggia gelata',en: 'Freezing drizzle' },
            57: { icon: 'rainy',             it: 'Pioggia gelata',en: 'Freezing drizzle' },
            61: { icon: 'rainy',             it: 'Pioggia',       en: 'Rain' },
            63: { icon: 'rainy',             it: 'Pioggia',       en: 'Rain' },
            65: { icon: 'rainy_heavy',       it: 'Pioggia forte', en: 'Heavy rain' },
            66: { icon: 'weather_mix',       it: 'Pioggia gelata',en: 'Freezing rain' },
            67: { icon: 'weather_mix',       it: 'Pioggia gelata',en: 'Freezing rain' },
            71: { icon: 'weather_snowy',     it: 'Neve',          en: 'Snow' },
            73: { icon: 'weather_snowy',     it: 'Neve',          en: 'Snow' },
            75: { icon: 'weather_snowy',     it: 'Neve',          en: 'Snow' },
            77: { icon: 'weather_snowy',     it: 'Neve',          en: 'Snow grains' },
            80: { icon: 'rainy',             it: 'Rovesci',       en: 'Showers' },
            81: { icon: 'rainy',             it: 'Rovesci',       en: 'Showers' },
            82: { icon: 'rainy_heavy',       it: 'Rovesci forti', en: 'Heavy showers' },
            85: { icon: 'weather_snowy',     it: 'Rovesci neve',  en: 'Snow showers' },
            86: { icon: 'weather_snowy',     it: 'Rovesci neve',  en: 'Snow showers' },
            95: { icon: 'thunderstorm',      it: 'Temporale',     en: 'Thunderstorm' },
            96: { icon: 'thunderstorm',      it: 'Temporale',     en: 'Thunderstorm' },
            99: { icon: 'thunderstorm',      it: 'Temporale',     en: 'Thunderstorm' }
        };

        const dayLabels = {
            it: ['Oggi', 'Domani'],
            en: ['Today', 'Tomorrow']
        };

        function renderMenu(lang) {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';
            MENU_ITEMS.forEach(item => {
                const a = document.createElement('a');
                a.href = `${item.id}.html`;
                a.className = 'btn';
                a.innerHTML = `<div class="circle"><span class="material-symbols-outlined">${item.icon}</span></div><span class="label">${item[lang]}</span>`;
                grid.appendChild(a);
            });
        }

        function translateStaticTexts(lang) {
            document.querySelectorAll('[data-it]').forEach(el => {
                const value = el.getAttribute('data-' + lang);
                if (value) el.innerText = value;
            });
        }

        function setLanguage(lang) {
            localStorage.setItem('preferredLang', lang);
            document.getElementById('btn-it').classList.toggle('active', lang === 'it');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            translateStaticTexts(lang);
            renderMenu(lang);
            updateWeather(lang);
        }

        function weekdayLabel(dateString, lang) {
            const date = new Date(dateString + 'T12:00:00');
            return new Intl.DateTimeFormat(lang === 'it' ? 'it-IT' : 'en-US', { weekday: 'short' }).format(date).replace('.', '');
        }

        function applyForecastDay(card, label, info, max, min) {
            const name = card.querySelector('.forecast-name');
            const icon = card.querySelector('.forecast-icon');
            const desc = card.querySelector('.forecast-desc');
            const strong = card.querySelector('.forecast-temps strong');
            const small = card.querySelector('.forecast-temps small');
            name.innerText = label;
            icon.innerText = info.icon;
            desc.innerText = info.label;
            strong.innerText = `${Math.round(max)}°`;
            small.innerText = `${Math.round(min)}°`;
        }

        async function updateWeather(lang) {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=40.6321&longitude=17.9361&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=3');
                const data = await res.json();
                const days = document.querySelectorAll('.forecast-day');
                const codes = data?.daily?.weathercode || [];
                const maxs = data?.daily?.temperature_2m_max || [];
                const mins = data?.daily?.temperature_2m_min || [];
                const dates = data?.daily?.time || [];

                days.forEach((card, index) => {
                    const code = codes[index];
                    const base = weatherMap[code] || { icon: 'cloud', it: 'Variabile', en: 'Variable' };
                    const info = { icon: base.icon, label: base[lang] };
                    const label = index < 2
                        ? dayLabels[lang][index]
                        : weekdayLabel(dates[index], lang);
                    applyForecastDay(card, label, info, maxs[index], mins[index]);
                });
            } catch (e) {
                console.error('Weather error', e);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const lang = localStorage.getItem('preferredLang') || 'it';
            setLanguage(lang);
        });
    </script>



<script id="diomede-mobile-landscape-layout">
(function () {
    function viewportSize() {
        const vv = window.visualViewport;
        return {
            w: Math.round(vv && vv.width ? vv.width : window.innerWidth),
            h: Math.round(vv && vv.height ? vv.height : window.innerHeight)
        };
    }

    function updateLandscapeLayout() {
        const size = viewportSize();
        const isLandscape = size.w > size.h;
        const isPhoneLandscape = isLandscape && size.h <= 520 && size.w <= 1000;

        document.body.classList.toggle('diomede-mobile-landscape', isPhoneLandscape);
        document.body.classList.toggle(
            'diomede-landscape-short',
            isPhoneLandscape && size.h <= 370
        );
    }

    updateLandscapeLayout();
    document.addEventListener('DOMContentLoaded', updateLandscapeLayout);
    window.addEventListener('load', updateLandscapeLayout);
    window.addEventListener('resize', updateLandscapeLayout);
    window.addEventListener('orientationchange', function () {
        updateLandscapeLayout();
        requestAnimationFrame(updateLandscapeLayout);
        setTimeout(updateLandscapeLayout, 120);
        setTimeout(updateLandscapeLayout, 400);
    });

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateLandscapeLayout);
    }
})();
</script>

<script id="diomede-viewport-fix">
(function () {
    let resizeTimer;

    function actualViewportHeight() {
        if (window.visualViewport && window.visualViewport.height) {
            return Math.round(window.visualViewport.height);
        }
        return Math.round(window.innerHeight);
    }

    function setAppHeight() {
        const h = actualViewportHeight();
        if (h > 0) {
            document.documentElement.style.setProperty('--app-height', h + 'px');
        }
    }

    function refreshViewport() {
        setAppHeight();
        requestAnimationFrame(setAppHeight);
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(setAppHeight, 100);
        setTimeout(setAppHeight, 300);
        setTimeout(setAppHeight, 700);
    }

    refreshViewport();

    document.addEventListener('DOMContentLoaded', refreshViewport);
    window.addEventListener('load', refreshViewport);
    window.addEventListener('pageshow', refreshViewport);
    window.addEventListener('resize', refreshViewport);
    window.addEventListener('orientationchange', refreshViewport);

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', refreshViewport);
    }
})();
</script>
