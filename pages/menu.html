<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu - Diomede Luxury</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Open+Sans:wght@400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,200,0,0&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.2);
            --glass-border: rgba(255, 255, 255, 0.3);
            --bg-overlay: rgba(0, 0, 0, 0.4);
            --primary-font: 'Open Sans', sans-serif;
            --elegant-font: 'PT Serif', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        /* CONFIGURAZIONE SFONDO DIRETTA */
        body, html {
            min-height: 100%;
            height: 100dvh;
            font-family: var(--primary-font);
            color: white;
            background-color: #1a1a1a; /* Colore di emergenza se l'immagine fallisce */
            
            /* Sfondo applicato direttamente qui per massima compatibilità */
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                              url('../assets/images/sfondo.png');
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100dvh;
            padding: 10px 15px 20px;
            position: relative;
            z-index: 1;
        }

        /* --- UI Components --- */
        .header-section { text-align: center; width: 100%; margin-top: 5px; }
        
        .logo-img {
            width: 90%; 
            max-width: 380px;
            height: auto;
            margin-bottom: 5px;
            animation: logoFadeIn 1s ease-out forwards 0.2s;
            opacity: 0;
        }

        .welcome-text {
            font-family: var(--elegant-font);
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            animation: fadeInUp 0.8s forwards 0.5s;
            opacity: 0;
        }

        .subtitle {
            font-family: var(--elegant-font);
            font-size: 13px;
            line-height: 1.3;
            margin: 5px auto;
            max-width: 280px;
            animation: fadeInUp 0.8s forwards 0.7s;
            opacity: 0;
        }

        .lang-switcher { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; z-index: 100; }
        
        .lang-btn {
            width: 35px; height: 35px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.1);
            color: white; font-size: 10px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(8px);
        }

        .lang-btn.active { background: white; color: black; }

        /* --- Grid Menu Ottimizzata --- */
        #main-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px 10px;
            width: 100%;
            max-width: 360px;
            margin: 10px 0;
        }

        .btn {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            animation: fadeInUp 0.5s forwards;
            opacity: 0;
        }

        .circle {
            width: 60px; height: 60px; /* Compatto per non tagliare il meteo */
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 6px; transition: 0.2s;
        }

        .btn:active .circle { transform: scale(0.9); }
        .material-symbols-outlined { font-size: 24px; }
        .label { font-size: 8px; text-transform: uppercase; font-weight: 700; text-align: center; }

        /* --- Weather --- */
        .weather-widget {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 20px; background: rgba(255,255,255,0.12);
            backdrop-filter: blur(15px); border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            text-decoration: none; color: white;
            animation: fadeInUp 0.8s forwards 1.2s; opacity: 0;
            margin-bottom: 10px;
        }

        .temp-val { font-size: 16px; font-weight: 600; font-family: var(--elegant-font); }
        .city-name { font-family: var(--elegant-font); font-size: 13px; border-left: 1px solid rgba(255,255,255,0.3); padding-left: 10px; }

        /* --- Animations --- */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes logoFadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="container">
        <nav class="lang-switcher">
            <div id="btn-it" class="lang-btn" onclick="setLanguage('it')">ITA</div>
            <div id="btn-en" class="lang-btn" onclick="setLanguage('en')">ENG</div>
        </nav>

        <header class="header-section">
            <img src="../assets/images/header.png" alt="Logo" class="logo-img">
            <h1 class="welcome-text" data-it="Benvenuti" data-en="Welcome">Benvenuti</h1>
            <p class="subtitle" data-it="È un piacere avervi qui. Mettetevi comodi e godetevi ogni angolo della casa" data-en="We are delighted to have you stay. Please, enjoy the space">È un piacere avervi qui. Mettetevi comodi e godetevi ogni angolo della casa</p>
        </header>

        <nav id="main-grid"></nav>

        <a href="https://www.google.com/search?q=meteo+brindisi" target="_blank" class="weather-widget">
            <span id="weather-icon" class="material-symbols-outlined">cloud</span>
            <span id="description">...</span>
            <span id="temp" class="temp-val">--</span>
            <span class="city-name">Brindisi</span>
        </a>
    </div>

    <script>
        const MENU_ITEMS = [
            { id: 'dettagli',    icon: 'home',           it: 'Dotazioni',    en: 'Amenities' },
            { id: 'contatti',    icon: 'call',           it: 'Contatti',     en: 'Contacts' },
            { id: 'regole',      icon: 'gavel',          it: 'Regole',       en: 'House Rules' },
            { id: 'istruzioni',  icon: 'menu_book',      it: 'Istruzioni',   en: 'Instructions' },
            { id: 'wifi',        icon: 'wifi',           it: 'Wi-Fi',        en: 'Wi-Fi' },
            { id: 'trasporti',   icon: 'directions_bus', it: 'Trasporti',    en: 'Transport' },
            { id: 'turismo',     icon: 'explore',        it: 'Territorio',   en: 'Explore' },
            { id: 'convenzioni', icon: 'sell',           it: 'Partner',      en: 'Partners' },
            { id: 'checkout',    icon: 'logout',         it: 'Check-Out',    en: 'Check-Out' }
        ];

        const weatherMap = { 0: {icon:'wb_sunny', it:'Sereno', en:'Clear'}, 3: {icon:'cloud', it:'Nuvoloso', en:'Cloudy'}, 61: {icon:'rainy', it:'Pioggia', en:'Rain'} };

        function renderMenu(lang) {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';
            MENU_ITEMS.forEach((item, index) => {
                const a = document.createElement('a');
                a.href = `${item.id}.html`; 
                a.className = 'btn';
                a.innerHTML = `
                    <div class="circle"><span class="material-symbols-outlined">${item.icon}</span></div>
                    <span class="label">${item[lang]}</span>
                `;
                grid.appendChild(a);
            });
        }

        function setLanguage(lang) {
            localStorage.setItem('preferredLang', lang);
            document.getElementById('btn-it').classList.toggle('active', lang === 'it');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.querySelectorAll('[data-it]').forEach(el => {
                el.innerText = el.getAttribute('data-' + lang);
            });
            renderMenu(lang);
            updateWeather(lang);
        }

        async function updateWeather(lang) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=40.6321&longitude=17.9361&current_weather=true`);
                const data = await res.json();
                const code = data.current_weather.weathercode;
                const info = weatherMap[code] || { icon: 'cloud', it: 'Nuvoloso', en: 'Cloudy' };
                document.getElementById('temp').innerText = Math.round(data.current_weather.temperature) + '°C';
                document.getElementById('weather-icon').innerText = info.icon;
                document.getElementById('description').innerText = info[lang];
            } catch (e) { console.error("Weather error"); }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const lang = localStorage.getItem('preferredLang') || 'it';
            setLanguage(lang);
        });
    </script>
</body>
</html>
