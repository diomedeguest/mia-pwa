<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Benvenuti - Diomede Luxury</title>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:italic,wght@400;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: url('sfondo.png') no-repeat center center;
            background-size: cover;
            background-color: #B5A89A;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Overlay scuro per far risaltare il testo */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .splash-container {
            width: 90%;
            max-width: 600px; 
            text-align: center;
            position: relative;
            z-index: 10;
            /* Inizia la dissolvenza a 6 secondi per chiudere a 7 */
            animation: fadeOutPage 1s ease-in-out forwards;
            animation-delay: 6s;
        }

        .logo-container {
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInScale 1.8s ease-out forwards;
        }

        .logo-container img {
            width: 350px; 
            max-width: 100%;
            height: auto;
            /* Se il logo ha sfondo bianco, mix-blend-mode lo pulisce */
            mix-blend-mode: multiply; 
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.3));
        }

        .welcome-text {
            font-family: 'PT Serif', serif;
            color: #ffffff;
            line-height: 1.6;
            font-size: 18px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1.8s ease-out forwards;
            animation-delay: 0.8s;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
            padding: 0 10px;
        }

        .welcome-text i {
            display: block;
            margin-bottom: 12px;
            font-size: 30px; 
            font-weight: 700;
            font-style: normal;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .signature {
            margin-top: 25px;
            font-family: 'PT Serif', serif;
            font-style: italic;
            font-size: 22px;
            color: #ffffff;
            opacity: 0;
            animation: fadeIn 1.5s ease-out forwards;
            animation-delay: 2.8s;
        }

        /* ANIMAZIONI */
        @keyframes fadeInScale { 
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes fadeIn { to { opacity: 1; } }
        
        @keyframes fadeInUp { 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        @keyframes fadeOutPage { 
            to { opacity: 0; transform: scale(1.02); visibility: hidden; } 
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <div class="logo-container">
            <img src="logowelcome.png" alt="Diomede Luxury">
        </div>

        <div class="welcome-text">
            <i>Benvenuti!</i>
            È un piacere avervi qui. Mettetevi comodi e godetevi ogni angolo della casa, che sia per un calice di vino in relax o come base per esplorare la zona. Abbiamo pensato a ogni dettaglio per il vostro arrivo; se dovesse servirvi altro, siamo a vostra disposizione.
        </div>

        <div class="signature">Buona permanenza!</div>
    </div>

    <script>
        // Reindirizzamento automatico dopo 7 secondi
        setTimeout(function(){
            window.location.href = 'start.html'; 
        }, 7000);
    </script>

</body>
</html>
