<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Welcome - Diomede Luxury</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Open Sans', sans-serif;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* SFONDO CON ZOOM LENTO */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.2)), url('logo_start.png') no-repeat center center;
            background-size: cover;
            z-index: 1;
            animation: slowZoom 25s infinite alternate;
        }

        @keyframes slowZoom {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        /* BOX BIANCO */
        .white-box {
            position: relative;
            z-index: 2;
            background-color: rgba(255, 255, 255, 0.98);
            width: 88%;
            max-width: 370px;
            padding: 55px 35px;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: revealBox 1.4s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
            animation-delay: 0.3s;
        }

        @keyframes revealBox {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-inner {
            width: 130px;
            height: auto;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
            animation-delay: 1s;
        }

        /* TITOLI CON INIZIALI MAIUSCOLE */
        .title-container {
            margin-bottom: 5px;
        }

        .title-text {
            font-family: 'PT Serif', serif;
            font-weight: 400;
            font-size: 50px;
            color: #000;
            margin: 0;
            line-height: 0.9;
            letter-spacing: -0.5px;
            display: block;
            opacity: 0;
            animation: fadeInUp 1s ease forwards;
        }

        .title-text:nth-child(1) { animation-delay: 1.3s; }
        .title-text:nth-child(2) { animation-delay: 1.5s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .divider {
            width: 35px;
            height: 1px;
            background-color: #000;
            margin: 30px auto;
            transform: scaleX(0);
            animation: scaleX 1s ease forwards;
            animation-delay: 1.8s;
        }

        @keyframes scaleX {
            to { transform: scaleX(1); }
        }

        .subtitle {
            font-family: 'PT Serif', serif;
            font-size: 19px;
            color: #000;
            margin-bottom: 6px;
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
            animation-delay: 2s;
        }

        .tagline {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 45px;
            line-height: 1.6;
            max-width: 230px;
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
            animation-delay: 2.2s;
        }

        /* PULSANTE PUNTATO AD ASSETS/MENU.HTML */
        .enter-btn {
            display: inline-block;
            padding: 18px 0;
            width: 100%;
            background-color: #000;
            color: #fff;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            transition: all 0.4s ease;
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
            animation-delay: 2.4s;
        }

        .enter-btn:active {
            background-color: #333;
            transform: scale(0.97);
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="white-box">
        <img src="logo.png" alt="Logo" class="logo-inner">

        <div class="title-container">
            <span class="title-text">Welcome</span>
            <span class="title-text">Guide</span>
        </div>

        <div class="divider"></div>

        <div class="subtitle">Diomede Luxury Apartment</div>
        <div class="tagline">Sentitevi a casa: tutto quello che c'è da sapere</div>

        <a href="assets/menu.html" class="enter-btn">Entra</a>
    </div>

</body>
</html>
