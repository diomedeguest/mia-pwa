<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes,viewport-fit=cover>
    <title>Welcome - Diomede Luxury</title>
    <script>
    /* Diomede: scelta esplicita fra modalità ospite e tablet kiosk.
       ?mode=kiosk attiva e memorizza il kiosk; ?mode=guest torna alla PWA completa. */
    try {
        const diomedeParams = new URLSearchParams(window.location.search);
        const requestedMode = (diomedeParams.get('mode') || '').toLowerCase();
        if (requestedMode === 'kiosk') localStorage.setItem('diomedeMode', 'kiosk');
        if (requestedMode === 'guest') {
            localStorage.removeItem('diomedeMode');
        }

        const kioskActive = localStorage.getItem('diomedeMode') === 'kiosk';
        if (kioskActive) {
            document.documentElement.classList.add('diomede-kiosk-mode');
        }
    } catch (_) {}
    </script>

    <script>
    try {
        if (sessionStorage.getItem('diomede-session-visited')) {
            document.documentElement.classList.add('returning-guest');
        } else {
            sessionStorage.setItem('diomede-session-visited', '1');
        }
    } catch (_) {}
    </script>
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Open+Sans:wght@300;400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,200,0,0&display=swap" rel="stylesheet">

    <style>
        /* Reset e Base */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            height: 100%; margin: 0; padding: 0;
            font-family: 'Open Sans', sans-serif;
            background-color: #000;
            overflow: hidden;
        }

        /* --- 1. Splash Screen --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: none;
            animation: fadeOutSplash 1.00s cubic-bezier(.22,.61,.36,1) 4.20s forwards;
        }

        .splash-logo {
            width: 180px; height: auto;
            opacity: 0;
            animation:
                logoEntrata 1.05s cubic-bezier(.22,.61,.36,1) .18s forwards,
                logoPulsazione 1.65s ease-in-out 1.20s 1;
        }

        /* --- 2. Main Content --- */
        #main-content {
            position: relative;
            z-index: 2;
            height: 100%; width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: fadeInMain .95s cubic-bezier(.22,.61,.36,1) 4.45s forwards;
        }

        .bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.3)), url('logo_start.png') no-repeat center center;
            background-size: cover;
            z-index: 1;
            pointer-events: none;
            animation: slowZoom 24s infinite alternate ease-in-out;
        }

        .white-box {
            position: relative;
            z-index: 3;
            pointer-events: auto;
            background-color: rgba(255, 255, 255, 0.88);
            width: 88%;
            max-width: 380px;
            padding: 34px 28px 36px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; align-items: center;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,.52);
            -webkit-backdrop-filter: blur(12px) saturate(108%);
            backdrop-filter: blur(12px) saturate(108%);
        }

        /* --- 3. Elementi e Animazioni --- */
        .logo-inner, .title-container, .divider, .subtitle, .tagline, .enter-btn {
            opacity: 0;
            animation: fadeInUp .48s ease forwards;
        }

        .logo-inner { width: 118px; max-height: 92px; object-fit: contain; height: auto; margin-bottom: 20px; animation-delay: .96s; }
        .title-text { font-family: 'PT Serif', serif; font-size: 38px; color: #000; margin: 0; line-height: 1.1; letter-spacing: -0.5px; }
        .title-container { animation-delay: 1.04s; }

        .divider {
            width: 40px; height: 1px; background-color: #000; margin: 18px auto;
            animation: scaleDivider 0.8s ease forwards;
            animation-delay: 1.12s;
        }

        .subtitle { font-family: 'PT Serif', serif; font-size: 18px; color: #000; margin-bottom: 8px; animation-delay: 1.20s; }
        .tagline { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #666; margin-bottom: 28px; animation-delay: 1.28s; }
        .enter-btn {
            animation-delay: 1.28s;
            position: relative;
            z-index: 10;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Keyframes */
        @keyframes logoEntrata { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes logoPulsazione { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes fadeOutSplash { from { opacity: 1; visibility: visible; } to { opacity: 0; visibility: hidden; } }
        @keyframes fadeInMain { to { opacity: 1; } }
        @keyframes slowZoom { from { transform: scale(1); } to { transform: scale(1.1); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleDivider { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }

        /* Bottone */
        .enter-btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 16px 45px; background-color: #000; color: #fff;
            text-decoration: none; text-transform: uppercase;
            font-size: 11px; font-weight: 700; letter-spacing: 2px;
            border-radius: 50px; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .enter-btn span { margin-right: 10px; font-size: 18px; }
        .enter-btn:active { transform: scale(0.95); background-color: #222; }


        /* Smartphone portrait: immagine completa e pannello Welcome più leggero */
        @media (max-width: 600px) and (orientation: portrait) {
            .bg-image {
                background-size: cover;
                background-position: center center;
                background-repeat: no-repeat;
            }

            .white-box {
                width: min(82vw, 330px);
                padding: 24px 22px 26px;
                background: rgba(255, 255, 255, 0.72);
                box-sizing: border-box;
            }

            .logo-inner {
                width: 92px;
                max-height: 70px;
                margin-bottom: 13px;
            }

            .title-text {
                font-size: 32px;
            }

            .divider {
                margin: 12px auto;
            }

            .tagline {
                margin-bottom: 18px;
            }

            .enter-btn {
                padding: 13px 34px;
            }
        }

        html.returning-guest #splash-screen { display: none; }
        html.returning-guest #main-content { opacity: 1; animation: none; }
        html.returning-guest .logo-inner,
        html.returning-guest .title-container,
        html.returning-guest .divider,
        html.returning-guest .subtitle,
        html.returning-guest .tagline,
        html.returning-guest .enter-btn {
            opacity: 1; transform: none; animation: none;
        }

        @media (max-height: 700px) {
            .white-box { padding: 24px 24px 26px; }
            .logo-inner { width: 96px; max-height: 72px; margin-bottom: 14px; }
            .title-text { font-size: 34px; }
            .divider { margin: 13px auto; }
            .tagline { margin-bottom: 20px; }
            .enter-btn { padding: 13px 38px; }
        }
    
/* Splash Diomede: ingresso più lento e cinematografico */
@media (prefers-reduced-motion: no-preference) {
    .bg-image {
        animation-duration: 10s !important;
    }
    .white-box {
        animation-duration: 1.15s !important;
        animation-delay: .30s !important;
    }
    .logo-inner {
        animation-duration: 1.0s !important;
        animation-delay: .55s !important;
    }
    .title-text {
        animation-duration: 1.0s !important;
        animation-delay: .78s !important;
    }
    .tagline {
        animation-duration: .95s !important;
        animation-delay: 1.00s !important;
    }
    .enter-btn {
        animation-duration: .95s !important;
        animation-delay: 1.22s !important;
    }
}


/* Fix definitivo ingresso mobile: il CTA usa il normale comportamento del link. */
#main-content,
.white-box,
.enter-btn {
    pointer-events: auto;
}
#splash-screen,
.bg-image {
    pointer-events: none !important;
}
.enter-btn {
    cursor: pointer;
    -webkit-touch-callout: none;
}




/* Splash iniziale Diomede: versione più lenta e scenografica */
@media (prefers-reduced-motion: no-preference) {
    #splash-screen {
        animation: fadeOutSplash 1.00s cubic-bezier(.22,.61,.36,1) 4.20s forwards !important;
    }
    .splash-logo {
        animation:
            logoEntrata 1.45s cubic-bezier(.22,.61,.36,1) .30s forwards,
            logoPulsazione 2.10s ease-in-out 1.65s 1 !important;
    }
    #main-content {
        animation: fadeInMain .95s cubic-bezier(.22,.61,.36,1) 4.45s forwards !important;
    }
}



/* ==========================================================
   WELCOME INDEX — STILE FINALE CONSOLIDATO
   Mantiene l'aspetto approvato eliminando gli override storici.
   ========================================================== */
.white-box {
    width: min(80vw, 330px) !important;
    min-width: 0 !important;
    max-width: 330px !important;
    padding: 10px 14px 13px !important;

    border-radius: 15px !important;
    box-shadow: 0 12px 28px rgba(0,0,0,.18) !important;

}

.logo-inner {

    max-width: 84% !important;
    max-height: 190px !important;
    height: auto !important;

    object-fit: contain !important;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.10)) !important;
}

.divider { margin: 7px auto !important; }
.subtitle { margin-bottom: 2px !important; }
.tagline { margin-bottom: 10px !important; }

@media (max-width: 600px) and (orientation: portrait) {
    .white-box {
        width: min(80vw, 300px) !important;
        max-width: 300px !important;
        padding: 10px 11px 13px !important;
        background: rgba(255,255,255,.66) !important;
        border-color: rgba(255,255,255,.62) !important;
    }

    .logo-inner {
        width: 220px !important;
        max-width: 84% !important;
        max-height: 160px !important;
        margin-bottom: 3px !important;
    }

    .divider { margin: 6px auto !important; }
    .subtitle { margin-bottom: 2px !important; }
    .tagline { margin-bottom: 9px !important; }
}

@media (max-height: 700px) {
    .white-box {
        width: min(80vw, 310px) !important;
        max-width: 310px !important;
        padding-top: 8px !important;
        padding-bottom: 10px !important;
        background: rgba(255,255,255,.64) !important;
    }

    .logo-inner {
        width: 198px !important;
        max-width: 80% !important;
        max-height: 138px !important;
        margin-bottom: 2px !important;
    }

    .divider { margin: 5px auto !important; }
    .tagline { margin-bottom: 7px !important; }
}

</style>

</head>
<body>
<div id="splash-screen">
        <img src="logo.png" alt="Diomede Luxury Splash" class="splash-logo">
    </div>

    <div id="main-content">
        <div class="bg-image"></div>
        <div class="white-box">
            <img src="assets/images/logo-transparent.png" alt="Diomede Luxury Logo" class="logo-inner">
            <div class="title-container">
                <h1 class="title-text">Welcome Guide</h1>
            </div>
            <div class="divider"></div>
            <div class="subtitle">Diomede Luxury Apartment</div>
            <div class="tagline">Sentitevi a casa</div>
            <a href="./pages/menu.html" class="enter-btn" id="enter-diomedeguide">
                <span class="material-symbols-outlined">login</span>
                Entra
            </a>
        </div>
    </div>

<script id="diomede-mode-forward-index">
(function(){
  function currentMode(){
    try {
      const p=new URLSearchParams(location.search);
      const q=(p.get('mode')||'').toLowerCase();
      if(q==='kiosk') localStorage.setItem('diomedeMode','kiosk');
      if(q==='guest') localStorage.removeItem('diomedeMode');
      return localStorage.getItem('diomedeMode')==='kiosk'?'kiosk':'guest';
    } catch(_) { return 'guest'; }
  }
  function apply(){
    const mode=currentMode();
    const btn=document.getElementById('enter-diomedeguide');
    if(!btn) return;
    const u=new URL('./pages/menu.html', location.href);
    if(mode==='kiosk') u.searchParams.set('mode','kiosk');
    btn.href=u.href;
  }
  document.addEventListener('DOMContentLoaded', apply);
  window.addEventListener('pageshow', apply);
})();
</script>

<script>
window.addEventListener('load', function () {
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
    }
});
</script>
</body>
