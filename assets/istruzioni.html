<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Istruzioni - Diomede Luxury</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Open+Sans:wght@400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,200,0,0&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Open Sans', sans-serif; 
            margin: 0; padding: 20px; 
            text-align: center; 
            background-color: #ffffff; 
            color: #000000;
        }
        
        .container { max-width: 450px; margin: 0 auto; }
        
        .logo-header { 
            width: 100%; 
            height: auto; 
            display: block; 
            margin-bottom: 20px; 
        }
        
        h2 { 
            font-family: 'PT Serif', serif;
            font-weight: 400; font-size: 32px; 
            text-transform: capitalize;
            margin: 10px 0 5px 0;
            letter-spacing: 1px;
        }
        
        .divider { width: 40px; height: 1px; background-color: #000; margin: 15px auto 30px; }

        .instruction-card {
            background-color: #F8F8F8;
            border: 1px solid #E0E0E0;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none; 
            color: inherit;
            transition: background-color 0.2s;
            width: 100%;
        }

        .instruction-card:active { background-color: #F0F0F0; }

        .left-content { display: flex; align-items: center; }

        .material-symbols-outlined {
            font-size: 26px;
            color: #000;
            font-variation-settings: 'wght' 200;
        }

        .main-icon { margin-right: 15px; }
        
        .touch-icon { 
            font-size: 24px; 
            opacity: 0.4;
        }

        .card-title {
            font-size: 13px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .back-link { 
            display: inline-block; margin-top: 30px;
            text-decoration: none; color: #000; 
            font-size: 10px; font-weight: 600;
            text-transform: uppercase; border-bottom: 1px solid #000;
            padding-bottom: 3px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo_istruzioni.png" alt="Diomede Luxury Logo" class="logo-header">

        <h2>Istruzioni</h2>
        <div class="divider"></div>

        <a href="assets/documents/cucina.pdf">Apri PDF Cucina</a>
            <div class="left-content">
                <span class="material-symbols-outlined main-icon">coffee_maker</span>
                <span class="card-title">Macchina del Caffè</span>
            </div>
            <span class="material-symbols-outlined touch-icon">touch_long</span>
        </a>

        <a href="assets/documents/cucina.pdf" class="instruction-card" target="_blank">
            <div class="left-content">
                <span class="material-symbols-outlined main-icon">cooking</span>
                <span class="card-title">Piano a Induzione</span>
            </div>
            <span class="material-symbols-outlined touch-icon">touch_long</span>
        </a>

        <a href="assets/documents/depuratore.pdf" class="instruction-card" target="_blank">
            <div class="left-content">
                <span class="material-symbols-outlined main-icon">water_full</span>
                <span class="card-title">Depuratore d'acqua</span>
            </div>
            <span class="material-symbols-outlined touch-icon">touch_long</span>
        </a>

        <a href="assets/documents/cassaforte.pdf" class="instruction-card" target="_blank">
            <div class="left-content">
                <span class="material-symbols-outlined main-icon">lock</span>
                <span class="card-title">Cassaforte</span>
            </div>
            <span class="material-symbols-outlined touch-icon">touch_long</span>
        </a>

        <a href="assets/documents/Idromassaggio.pdf" class="instruction-card" target="_blank">
            <div class="left-content">
                <span class="material-symbols-outlined main-icon">hot_tub</span>
                <span class="card-title">Vasca Idromassaggio</span>
            </div>
            <span class="material-symbols-outlined touch-icon">touch_long</span>
        </a>

        <a href="assets/documents/letto.pdf" class="instruction-card" target="_blank">
            <div class="left-content">
                <span class="material-symbols-outlined main-icon">bed</span>
                <span class="card-title">Letto Contenitore</span>
            </div>
            <span class="material-symbols-outlined touch-icon">touch_long</span>
        </a>
        <a href="../index.html" class="back-link">torna alla home</a>
    </div>

</body>
</html>
