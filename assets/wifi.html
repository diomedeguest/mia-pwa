<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Wi-Fi - Diomede Luxury</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Open+Sans:wght@400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,200,0,0&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Open Sans', sans-serif; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
            background-color: #ffffff; 
            color: #000000;
        }
        
        .container { max-width: 400px; margin: 0 auto; }
        .logo-wifi { width: 100%; height: auto; margin-bottom: 10px; display: block; }
        
        h2 { 
            font-family: 'PT Serif', serif;
            font-weight: 400;
            font-size: 35px; 
            text-transform: capitalize;
            margin: 10px 0 5px 0;
            letter-spacing: 1px;
        }
        
        .divider { width: 40px; height: 1px; background-color: #000000; margin: 15px auto 25px; }
        
        .info-box {
            background-color: #F8F8F8; 
            padding: 25px; 
            border-radius: 15px; 
            border: 1px solid #E0E0E0;
            text-align: left;
            width: 100%;
        }

        .item { margin-bottom: 25px; }
        .item:last-child { margin-bottom: 0; }

        .label-group { 
            display: flex; 
            align-items: center; 
            margin-bottom: 6px; 
        }

        .material-symbols-outlined { 
            font-size: 28px; 
            margin-right: 12px;
            color: #000000;
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 48;
        }
        
        .label { 
            font-size: 10px; 
            text-transform: uppercase; 
            font-weight: 600; 
            letter-spacing: 0.8px;
            color: #000000;
        }
        
        .value { 
            font-size: 18px; 
            font-weight: 600; 
            padding-left: 40px; 
            display: block;
            color: #000000;
            word-break: break-all;
        }

        .back-link { 
            display: inline-block;
            margin-top: 40px;
            text-decoration: none; 
            color: #000000; 
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #000;
            padding-bottom: 3px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo_wifi.png" alt="Logo" class="logo-wifi">

        <h2>connessione wi-fi</h2>
        <div class="divider"></div>

        <div class="info-box">
            <div class="item">
                <div class="label-group">
                    <span class="material-symbols-outlined">wifi</span>
                    <span class="label">nome rete</span>
                </div>
                <span class="value">Diomede_Luxury_Guest</span>
            </div>

            <div class="item">
                <div class="label-group">
                    <span class="material-symbols-outlined">key</span>
                    <span class="label">password</span>
                </div>
                <span class="value">StayAtDiomede2!</span>
            </div>
        </div>

        <a href="../index.html" class="back-link">torna alla home</a>
    </div>

</body>
</html>
