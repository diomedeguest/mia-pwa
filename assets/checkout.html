<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-Out - Diomede Luxury</title>
    <style>
        :root { --gold: #c5a059; --black: #1a1a1a; --success: #25D366; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f9f9f9; color: var(--black); }
        .nav-back { padding: 20px; }
        .nav-back a { text-decoration: none; color: var(--gold); font-weight: bold; }
        
        .container { padding: 0 25px 40px; text-align: center; }
        .checkout-header { background: var(--black); color: white; padding: 30px; border-radius: 20px; margin-bottom: 30px; }
        .checkout-header h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }
        .time-badge { display: inline-block; margin-top: 10px; padding: 5px 15px; border: 1px solid var(--gold); border-radius: 50px; color: var(--gold); font-weight: bold; }

        /* Checklist Style */
        .checklist { text-align: left; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .check-item { display: flex; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; cursor: pointer; }
        .check-item:last-child { border-bottom: none; }
        .check-item input[type="checkbox"] { width: 22px; height: 22px; margin-right: 15px; accent-color: var(--gold); }
        .check-item span { font-size: 0.95rem; line-height: 1.3; }

        /* Button WhatsApp */
        .btn-whatsapp { 
            display: flex; align-items: center; justify-content: center;
            background: var(--success); color: white; text-decoration: none;
            padding: 18px; border-radius: 50px; font-weight: bold; font-size: 1rem;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); transition: 0.3s;
        }
        .btn-whatsapp img { width: 24px; margin-right: 10px; filter: brightness(0) invert(1); }
        .btn-whatsapp.disabled { background
